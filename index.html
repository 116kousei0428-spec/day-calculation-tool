<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101b2c"><title>登録管理</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="￥管理"><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#eaf0f8;background:#0b1320;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.shell{max-width:1000px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.1em;color:#a2b2ca}.title{font-size:28px;font-weight:800;margin:6px 0 0}.status{font-size:12px;color:#a8bedc;display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;background:#e9a940;border-radius:50%;display:inline-block}.dot.ok{background:#4addad}.dot.bad{background:#ff7186}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:25px 0 15px;flex-wrap:wrap}.tabs{display:flex;background:#172338;padding:5px;border-radius:12px;gap:5px}.tab{border:0;border-radius:9px;color:#9fb3d0;background:transparent;padding:10px 15px}.tab.active{background:#344967;color:white;font-weight:700}.primary{background:#7eabff;color:#0e1a2e;border:0;border-radius:11px;padding:12px 18px;font-weight:800}.ghost{background:#263650;color:#e8f0ff;border:1px solid #3b506e;border-radius:9px;padding:9px 13px}.danger{background:#452a39;color:#ffb6c3;border:1px solid #714153;border-radius:9px;padding:9px 13px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 25px}.stat{padding:17px 18px;background:#152237;border:1px solid #263854;border-radius:15px}.stat small{display:block;color:#a1b4cd;margin-bottom:8px}.stat strong{font-size:clamp(18px,2.7vw,27px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#142137;border:1px solid #2d3e57;border-radius:16px;padding:18px}.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:start}.name{font-size:20px;font-weight:750;overflow-wrap:anywhere}.pill{background:#284a55;color:#92edd9;border-radius:40px;padding:5px 9px;font-size:12px;white-space:nowrap}.pill.completed{background:#38394f;color:#c5c4db}.amount{margin:14px 0 8px;font-size:clamp(25px,4vw,34px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}.meta{display:grid;gap:6px;font-size:13px;color:#b3c2d7}.note{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #2c3d53;padding-top:10px;margin-top:12px;font-size:13px;color:#cbd5e3}.actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #2d3f5a;padding-top:14px;margin-top:15px}.empty{text-align:center;color:#a3b5ce;border:1px dashed #405674;border-radius:15px;padding:46px 14px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:15px;z-index:5}.modal{background:#17243a;border:1px solid #435472;border-radius:18px;padding:22px;width:min(100%,470px);max-height:93vh;overflow:auto}.modal h2{margin:0 0 18px}.field{display:block;margin:14px 0}.field span{display:block;color:#c0cde0;font-size:13px;margin-bottom:6px}.field input,.field textarea{display:block;width:100%;background:#0f1c2e;border:1px solid #465b76;border-radius:9px;color:white;padding:12px;outline-color:#83b0ff}.field textarea{min-height:75px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.message{border-radius:10px;padding:13px;margin:16px 0;background:#46333c;color:#ffd3dc;white-space:pre-wrap;overflow-wrap:anywhere}.fine{font-size:12px;color:#9baecc;margin-top:22px;line-height:1.8}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.cards{grid-template-columns:1fr}.title{font-size:24px}.toolbar{margin-top:20px}}
</style></head><body><main class="shell"><header class="top"><div><div class="eyebrow">SHARED MANAGEMENT</div><h1 class="title">登録管理</h1></div><div class="status"><span id="dot" class="dot"></span><span id="connection">接続準備中</span></div></header>
<div id="error" class="message hidden" role="alert"></div>
<section class="summary"><div class="stat"><small>登録中</small><strong id="activeCount">0件</strong></div><div class="stat"><small>現在合計（登録中）</small><strong id="activeTotal">¥0</strong></div><div class="stat"><small>完了件数</small><strong id="doneCount">0件</strong></div></section>
<div class="toolbar"><div class="tabs"><button class="tab active" id="activeTab">登録中</button><button class="tab" id="doneTab">完了一覧</button></div><button class="primary" id="openAdd">＋ 新規登録</button></div><section id="cards" class="cards" aria-live="polite"></section><div id="empty" class="empty hidden">登録データはありません。</div><p class="fine">金額は単利計算です。開始日時から10日（240時間）経過するごとに、元金の10%を加算します。端数は最終金額で1円単位に四捨五入します。完了時点で増額を停止します。</p></main>
<div class="overlay hidden" id="addOverlay"><form class="modal" id="addForm"><h2>新規登録</h2><label class="field"><span>名前 *</span><input id="personName" required maxlength="100" autocomplete="off"></label><label class="field"><span>元金（円）*</span><input id="principal" type="number" min="0" max="999999999999" step="1" required></label><label class="field"><span>開始日時 *</span><input id="startTime" type="datetime-local" required></label><label class="field"><span>備考</span><textarea id="memo" maxlength="2000"></textarea></label><div class="modalactions"><button type="button" class="ghost" id="cancelAdd">キャンセル</button><button type="submit" class="primary" id="saveAdd">登録する</button></div></form></div>
<script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn));</script><script src="./config.js"></script><script type="module" src="./main.js"></script></body></html>
